name: AGESOMA Enterprise DB Integration

on:
  push:
    branches: [feat/enterprise-deployment-pilot-20261012]
  pull_request:
    branches: [main]
    paths:
      - 'tests/enterprise-deployment-db.test.mjs'
      - 'packages/db/migrations/0023_enterprise_deployments.sql'
      - 'packages/db/migrations/0024_selfserve_support.sql'
      - 'tests/selfserve-support-db.test.mjs'
      - 'packages/core/src/support-product.ts'
      - 'packages/core/test/support-product.test.mjs'
      - 'packages/core/src/paddle-billing.ts'
      - 'packages/core/test/paddle-billing.test.mjs'
      - 'apps/web/app/api/support/**'
      - 'apps/web/app/api/billing/**'
      - 'apps/web/app/console/support/**'
      - 'packages/core/src/enterprise-deployment.ts'
      - 'packages/core/test/enterprise-deployment.test.mjs'
      - 'apps/web/app/api/enterprise-deployments/route.ts'
      - 'apps/web/app/operations/onboarding/**'
      - '.github/workflows/enterprise-onboarding-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agesoma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agesoma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agesoma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Prepare isolated schema and role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role authenticated nologin;
          create schema agesoma_p0;
          create table agesoma_p0.tenants (
            id uuid primary key default gen_random_uuid(),
            name text not null
          );
          grant usage on schema agesoma_p0 to authenticated;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/migrations/0023_enterprise_deployments.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/migrations/0024_selfserve_support.sql
      - name: Test draft persistence, replay and RLS in real PostgreSQL
        run: npx tsx --test tests/enterprise-deployment-db.test.mjs
      - name: Test self-serve tenant and entitlement isolation in PostgreSQL
        run: npx tsx --test tests/selfserve-support-db.test.mjs
      - name: Test self-serve verified billing and bounded knowledge agent
        run: npx tsx --test packages/core/test/support-product.test.mjs packages/core/test/paddle-billing.test.mjs
      - name: Test end-to-end domain simulation
        run: npx tsx --test packages/core/test/enterprise-deployment.test.mjs
