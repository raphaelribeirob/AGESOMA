name: AGESOMA Vertical Pack Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vertical-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Test request routing
        run: node --test packages/core/test/request-router.test.mjs
      - name: Enforce first vertical work pack
        run: |
          test -f packages/core/src/vertical-packs.ts
          grep -q 'consorcio_sales_v1' packages/core/src/vertical-packs.ts
          grep -q 'resolveVerticalWorkPack' packages/core/src/request-router.ts
          grep -q 'verticalWorkPack: plan.verticalWorkPack' apps/web/app/api/requests/route.ts
          grep -q 'successSignals: plan.verticalWorkPack?.successSignals' apps/web/app/api/requests/route.ts
