name: AGESOMA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - name: Test core behavior
        run: npm test

      - name: Enforce single AGESOMA purpose
        run: |
          test -f docs/PRODUCT_SCOPE.md
          grep -q 'AGESOMA for SMEs' docs/PRODUCT_SCOPE.md
          test -f packages/db/migrations/0007_team_coordination.sql
          grep -q 'create table if not exists team_members' packages/db/migrations/0007_team_coordination.sql
          grep -q 'create table if not exists work_assignments' packages/db/migrations/0007_team_coordination.sql
          grep -q 'executor_type in' packages/db/migrations/0007_team_coordination.sql
          test -f apps/web/app/api/team/route.ts
          test -f apps/web/app/api/coordinate/route.ts
          test -f apps/web/app/api/assignments/route.ts
          test -f apps/web/app/api/agesoma/route.ts
          test -f apps/web/app/agesoma-client.tsx
          grep -q 'decideExecutor' packages/core/src/request-router.ts
          grep -q 'AGESOMAClient' apps/web/app/page.tsx
          grep -q 'className="agesomaConversation"' apps/web/app/agesoma-client.tsx
          grep -q 'className="agesomaComposer"' apps/web/app/agesoma-client.tsx
          if grep -q -E 'href="#(equipe|trabalho|resultados)"' apps/web/app/page.tsx; then
            echo "Dashboard navigation must not return to the canonical AGESOMA owner experience"
            exit 1
          fi
          if grep -R -n -E 'resolveVerticalWorkPack|verticalWorkPack|consorcio_sales_v1' packages/core/src/request-router.ts packages/core/src/index.ts apps/web/app; then
            echo "Niche product routing must not return to canonical AGESOMA flows"
            exit 1
          fi
          if grep -n -E 'HERMES|Hermes' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "HERMES must remain invisible in owner-facing AGESOMA UI"
            exit 1
          fi

      - name: Enforce AGESOMA digital workforce
        run: |
          test -f packages/core/src/agent-registry.ts
          test -f packages/db/migrations/0010_agent_registry.sql
          grep -q 'DEFAULT_AGENT_PACKAGE' packages/core/src/agent-registry.ts
          grep -q 'Agente de Vendas' packages/core/src/agent-registry.ts
          grep -q 'Agente de Marketing' packages/core/src/agent-registry.ts
          grep -q 'Agente de Atendimento' packages/core/src/agent-registry.ts
          grep -q 'Agente Financeiro' packages/core/src/agent-registry.ts
          grep -q 'Agente de Operações' packages/core/src/agent-registry.ts
          grep -q 'Agente de Pesquisa' packages/core/src/agent-registry.ts
          grep -q 'create table if not exists digital_agents' packages/db/migrations/0010_agent_registry.sql
          grep -q 'create table if not exists agent_task_assignments' packages/db/migrations/0010_agent_registry.sql
          grep -q 'agentTemplateForPlan' apps/web/app/api/agesoma/route.ts
          grep -q 'ensureAgentPackage' apps/web/app/api/agesoma/route.ts
          grep -q 'agent_task_assignments' apps/web/app/api/agesoma/route.ts
          grep -q 'runtime: "hermes-work-cell"' apps/web/app/api/agesoma/route.ts
          grep -q 'digitalAgent' services/worker/src/company-brain.ts
          if grep -n -E 'digital_agents|agent_task_assignments|hermes-work-cell' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "Digital workforce implementation details must stay behind the AGESOMA surface"
            exit 1
          fi

      - name: Enforce RiverThree product package
        run: |
          grep -q 'id: "agesoma"' apps/web/lib/riverthree-product.ts
          grep -q 'name: "AGESOMA"' apps/web/lib/riverthree-product.ts
          grep -q 'category: "smb-operating-intelligence"' apps/web/lib/riverthree-product.ts
          grep -q 'wordmark: "/agesoma-wordmark.jpeg"' apps/web/lib/riverthree-product.ts
          test -f apps/web/public/agesoma-wordmark.jpeg
          grep -q 'onboardingMode: "businessConsumerized"' apps/web/lib/riverthree-product.ts
          grep -q 'intelligenceOrb: "contextual"' apps/web/lib/riverthree-product.ts
          grep -q 'genZ: "subtle"' apps/web/lib/riverthree-product.ts
          grep -q 'mode: "agesomaConversation"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "company_context"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "team_size"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "team_structure"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "coordination_problem"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "coordination_preview"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "first_execution"' apps/web/lib/riverthree-product.ts
          grep -q 'activationEvent: "first_agesoma_request_accepted"' apps/web/lib/riverthree-product.ts
          grep -q 'r3ProgressHeader' apps/web/app/onboarding/page.tsx
          grep -q 'AGESOMAClient' apps/web/app/page.tsx
          if grep -n -E 'CAL AI|RIVERTHREE|Business Consumerized|actionAgent|Work Cell|Watchers' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "Internal design or architecture language must never appear in public product UI"
            exit 1
          fi
          if grep -n -E '\bROI\b|InstantWork' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "Public AGESOMA UI must use AGESOMA identity and demonstrate value without legacy labels"
            exit 1
          fi

      - name: Enforce canonical RiverThree UI bindings
        run: |
          grep -q 'className="agesomaShell"' apps/web/app/agesoma-client.tsx
          grep -q 'className="agesomaHeader"' apps/web/app/agesoma-client.tsx
          grep -q 'className="agesomaConversation"' apps/web/app/agesoma-client.tsx
          grep -q 'className="agesomaComposer"' apps/web/app/agesoma-client.tsx
          grep -q 'agesomaOrb' apps/web/app/agesoma-client.tsx
          grep -q 'agesomaApproval' apps/web/app/agesoma-client.tsx
          grep -q 'className="onboardingCard"' apps/web/app/onboarding/page.tsx
          grep -q 'className="r3WelcomeMaterial"' apps/web/app/onboarding/page.tsx
          grep -q 'className="choiceCheck"' apps/web/app/onboarding/page.tsx
          grep -q 'className="r3ResultPreview"' apps/web/app/onboarding/page.tsx
          grep -q 'className="r3FirstAction"' apps/web/app/onboarding/page.tsx
          if grep -E -n 'className="(homeHero|quietState|liveIntelligence|nextBestAction|metricStrip|activitySection|activityList|activityRow|resultsSection|resultCard|onboardingStage|welcomeMaterial|choiceMark|firstActionCard|intelligenceOrb)"' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "Non-canonical UI bindings detected; RiverThree classes must be used directly"
            exit 1
          fi

      - name: Enforce independent outcome verification
        run: |
          if grep -q "insert into outcome_events" services/worker/src/product-output.ts; then
            echo "Executor output must not write verified outcomes directly"
            exit 1
          fi
          grep -q "requireOutcomeVerifier" apps/web/app/api/outcomes/route.ts

      - name: Enforce resolve-before-approval
        run: |
          grep -q 'executionAction = plan.requiresApproval ? "business.work" : plan.action' apps/web/app/api/requests/route.ts
          grep -q 'plan.requiresApproval ? "business.work" : plan.action' apps/web/app/api/coordinate/route.ts
          grep -q 'Consequential action is not fully resolved' apps/web/app/api/approvals/route.ts
          grep -q 'Consequential capability is unresolved' services/worker/src/execution/task-runner.ts
          grep -q 'scope_hash' packages/db/src/repositories/approvals.ts
          grep -q 'buildCapabilityScope' apps/web/app/api/agesoma/route.ts
          grep -q 'scopeHash' apps/web/app/api/agesoma/route.ts

      - name: Enforce customer channel restriction
        run: |
          grep -q 'platform_toolsets' deploy/production/hermes-config.yaml
          grep -q 'whatsapp:' deploy/production/hermes-config.yaml
          if grep -A3 'whatsapp:' deploy/production/hermes-config.yaml | grep -Eq 'terminal|code_execution'; then
            echo "Customer WhatsApp must not expose terminal/code execution"
            exit 1
          fi

      - name: Enforce execution boundaries
        run: |
          test -f deploy/production/workcell-compose.yml
          test -f deploy/production/provision-workcell.sh
          test -f deploy/production/sentinel-egress.conf
          test -f deploy/production/credential-broker.conf.template
          grep -q 'HERMES_BASE_URL_TEMPLATE' services/worker/src/hermes.ts
          grep -q 'Tenant-routed Hermes Work Cell is required; shared Hermes is disabled' services/worker/src/hermes.ts
          grep -q 'CREDENTIAL_BROKER_BASE_URL_TEMPLATE' services/worker/src/hermes.ts
          grep -q 'maybeExecuteCredentialedAction' services/worker/src/hermes.ts
          grep -q 'AGESOMA_ALLOW_SHARED_HERMES: "false"' deploy/production/docker-compose.yml
          if grep -q '^  hermes:' deploy/production/docker-compose.yml; then
            echo "Canonical control plane must not embed a shared Hermes executor"
            exit 1
          fi
          hermes_block="$(awk '/^  hermes:/{flag=1} /^networks:/{if(flag)flag=0} flag' deploy/production/workcell-compose.yml)"
          if printf '%s\n' "$hermes_block" | grep -Eq 'WHATSAPP_CLOUD_ACCESS_TOKEN|WHATSAPP_CLOUD_APP_SECRET|WHATSAPP_CLOUD_VERIFY_TOKEN|CREDENTIAL_BROKER_SERVICE_TOKEN'; then
            echo "Business or broker credentials must never be injected into Hermes"
            exit 1
          fi
          broker_block="$(awk '/^  credential-broker:/{flag=1} /^  hermes:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          printf '%s\n' "$broker_block" | grep -q 'WHATSAPP_CLOUD_ACCESS_TOKEN'
          printf '%s\n' "$broker_block" | grep -q 'credential_cell'
          grep -q 'http_access deny all' deploy/production/sentinel-egress.conf
          grep -q 'docker network create --internal "agesoma-cell-$TENANT_ID"' deploy/production/provision-workcell.sh
          grep -q 'docker network create --internal "agesoma-credentials-$TENANT_ID"' deploy/production/provision-workcell.sh
          grep -q 'agesoma-control-worker' deploy/production/provision-workcell.sh

      - name: Validate production topology
        run: |
          sh -n deploy/production/provision-workcell.sh
          docker compose -f deploy/production/docker-compose.yml config >/dev/null
          AGESOMA_TENANT_ID=00000000-0000-0000-0000-000000000001 \
          WORKCELL_ALLOWLIST_FILE="$PWD/deploy/production/approved-domains.txt" \
          HERMES_SERVICE_TOKEN=test-hermes-token \
          CREDENTIAL_BROKER_SERVICE_TOKEN=test-broker-token \
          WHATSAPP_GRAPH_VERSION=v23.0 \
          WHATSAPP_CLOUD_PHONE_NUMBER_ID=100000000000001 \
          WHATSAPP_CLOUD_ACCESS_TOKEN=test-whatsapp-token \
          docker compose -f deploy/production/workcell-compose.yml config >/dev/null

      - name: Enforce tenant isolation migrations
        run: |
          grep -q 'force row level security' packages/db/migrations/0006_tenant_isolation.sql
          grep -q 'grant usage on schema agesoma_p0 to authenticated' packages/db/migrations/0006_tenant_isolation.sql
          grep -q 'credential_handles' packages/db/migrations/0005_muse_hardening.sql
          grep -q 'egress_decisions' packages/db/migrations/0005_muse_hardening.sql
          grep -q 'runtime_namespace' packages/db/migrations/0005_muse_hardening.sql
          grep -q 'alter table team_members force row level security' packages/db/migrations/0007_team_coordination.sql
          grep -q 'alter table work_assignments force row level security' packages/db/migrations/0007_team_coordination.sql
          grep -q 'alter table digital_agents force row level security' packages/db/migrations/0010_agent_registry.sql
          grep -q 'alter table agent_task_assignments force row level security' packages/db/migrations/0010_agent_registry.sql
          grep -q 'foreign key (tenant_id, agent_id)' packages/db/migrations/0010_agent_registry.sql
          grep -q 'foreign key (tenant_id, task_id)' packages/db/migrations/0010_agent_registry.sql

      - name: Build web app
        run: npm run build --workspace @agesoma/web

      - name: Mirror Next.js output to Vercel project root
        run: |
          rm -rf .next
          cp -R apps/web/.next .next
          test -f .next/routes-manifest.json
          test -f .next/build-manifest.json
