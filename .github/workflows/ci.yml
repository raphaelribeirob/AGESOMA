name: InstantWork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - name: Test request router
        run: node --test packages/core/test/request-router.test.mjs
      - name: Build web app
        run: npm run build --workspace @agesoma/web
      - name: Mirror Next.js output to Vercel project root
        run: |
          rm -rf .next
          cp -R apps/web/.next .next
          test -f .next/routes-manifest.json
          test -f .next/build-manifest.json
