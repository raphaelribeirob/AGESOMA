name: AGESOMA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - name: Test core behavior
        run: npm test

      - name: Enforce single AGESOMA purpose
        run: |
          test -f docs/PRODUCT_SCOPE.md
          grep -q 'personal executive assistant' docs/PRODUCT_SCOPE.md
          test -f packages/db/migrations/0007_team_coordination.sql
          grep -q 'create table if not exists team_members' packages/db/migrations/0007_team_coordination.sql
          grep -q 'create table if not exists work_assignments' packages/db/migrations/0007_team_coordination.sql
          grep -q 'executor_type in' packages/db/migrations/0007_team_coordination.sql
          test -f apps/web/app/api/team/route.ts
          test -f apps/web/app/api/coordinate/route.ts
          test -f apps/web/app/api/assignments/route.ts
          test -f apps/web/app/api/agesoma/route.ts
          test -f apps/web/app/agesoma-client.tsx
          grep -q 'decideExecutor' packages/core/src/request-router.ts
          grep -q 'AgesomaClient' apps/web/app/page.tsx
          grep -q 'className="museConversation"' apps/web/app/agesoma-client.tsx
          grep -q 'className="museComposer"' apps/web/app/agesoma-client.tsx
          if grep -q -E 'href="#(equipe|trabalho|resultados)"' apps/web/app/page.tsx; then
            echo "Dashboard navigation must not return to the canonical AGESOMA owner experience"
            exit 1
          fi
          if grep -R -n -E 'resolveVerticalWorkPack|verticalWorkPack|consorcio_sales_v1' packages/core/src/request-router.ts packages/core/src/index.ts apps/web/app; then
            echo "Niche product routing must not return to canonical AGESOMA flows"
            exit 1
          fi
          if grep -n -E 'HERMES|Hermes' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx apps/web/app/settings/page.tsx; then
            echo "HERMES must remain invisible in owner-facing AGESOMA UI"
            exit 1
          fi

      - name: Enforce AGESOMA capability boundary
        run: |
          test -f packages/core/src/agent-registry.ts
          test -f packages/db/migrations/0010_agent_registry.sql
          grep -q 'DEFAULT_AGENT_PACKAGE' packages/core/src/agent-registry.ts
          grep -q 'create table if not exists digital_agents' packages/db/migrations/0010_agent_registry.sql
          grep -q 'create table if not exists agent_task_assignments' packages/db/migrations/0010_agent_registry.sql
          grep -q 'agentTemplateForPlan' apps/web/app/api/agesoma/route.ts
          grep -q 'ensureAgentPackage' apps/web/app/api/agesoma/route.ts
          grep -q 'runtime: "personal-persistent-runtime"' apps/web/app/api/agesoma/route.ts
          grep -q 'paid_media.read' packages/core/src/action-registry.ts
          grep -q 'paid_media.set_campaign_budget' packages/core/src/action-registry.ts
          grep -q 'loadPaidMediaContext' services/worker/src/hermes.ts
          if grep -n -E 'digital_agents|agent_task_assignments|hermes-work-cell' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx apps/web/app/settings/page.tsx; then
            echo "Internal capability implementation details must stay behind the AGESOMA surface"
            exit 1
          fi
          if grep -n -Ei 'sua empresa|na sua empresa|converse com sua empresa' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx apps/web/app/settings/page.tsx; then
            echo "Legacy business positioning must not return to the personal assistant surface"
            exit 1
          fi

      - name: Enforce personal assistant runtime foundation
        run: |
          test -f packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'create table if not exists personal_context_entries' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'create table if not exists connected_services' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'create table if not exists proactivity_preferences' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'create table if not exists proactive_interruptions' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'digital_agents_domain_check' packages/db/migrations/0011_personal_assistant_foundation.sql
          test -f apps/web/app/api/personal-context/route.ts
          test -f apps/web/app/api/connections/route.ts
          test -f apps/web/app/api/proactivity/route.ts
          test -f apps/web/app/settings/page.tsx
          grep -q 'context-only-not-authorization-or-proof' apps/web/app/api/agesoma/route.ts
          grep -q 'containsSensitiveKey' apps/web/app/api/connections/route.ts
          grep -q 'maxInterruptionsPerDay' apps/web/app/api/proactivity/route.ts
          grep -q 'proactive_interruptions' services/worker/src/product-output.ts
          grep -q 'suppressInterruptions' services/worker/src/dispatch/watchers.ts
          grep -q 'href="/settings"' apps/web/app/agesoma-client.tsx

      - name: Enforce MUSE-parity runtime and attention
        run: |
          test -f packages/db/migrations/0012_muse_parity_runtime_attention.sql
          test -f docs/MUSE_PARITY.md
          test -f apps/web/app/api/goals/route.ts
          test -f apps/web/app/api/activity/route.ts
          test -f apps/web/app/api/runtime/route.ts
          grep -q "runtime_mode text not null default 'personal_persistent'" packages/db/migrations/0012_muse_parity_runtime_attention.sql
          grep -q 'create table if not exists activity_events' packages/db/migrations/0012_muse_parity_runtime_attention.sql
          grep -q 'create table if not exists attention_decisions' packages/db/migrations/0012_muse_parity_runtime_attention.sql
          grep -q "mode in ('silent','save','digest','notify','approval')" packages/db/migrations/0012_muse_parity_runtime_attention.sql
          grep -q 'personal-persistent-runtime' apps/web/app/api/agesoma/route.ts
          grep -q 'AGESOMA_RUNTIME_MODE: "personal_persistent"' deploy/production/workcell-compose.yml
          grep -q 'agesoma-runtime-.*:task-' services/worker/src/hermes.ts
          grep -q 'requireConnectedPermission' services/worker/src/hermes.ts
          grep -q 'decideAttention' services/worker/src/product-output.ts
          grep -q 'attention_decisions' services/worker/src/product-output.ts
          grep -q 'delivery_mode' apps/web/app/api/proactivity/route.ts
          grep -q 'permissionOptions' apps/web/app/api/connections/route.ts
          grep -q 'permissionOptions' apps/web/app/settings/page.tsx
          grep -q 'fetch("/api/goals"' apps/web/app/settings/page.tsx
          grep -q 'fetch("/api/activity?limit=30"' apps/web/app/settings/page.tsx
          if grep -q 'if (!clean || pending) return' apps/web/app/agesoma-client.tsx; then
            echo "Conversation must not serialize independent delegations"
            exit 1
          fi

      - name: Enforce free API discovery boundary
        run: |
          test -f services/worker/src/api-discovery.ts
          test -f services/worker/test/api-discovery.test.mjs
          test -f docs/API_DISCOVERY.md
          grep -q '"api.discover"' packages/core/src/action-registry.ts
          grep -q '"api.discover"' packages/core/src/routing/types.ts
          grep -q 'isApiDiscoveryRequest' packages/core/src/routing/request-router.ts
          grep -q 'public-api-lists.github.io/public-api-lists/api/all.json' services/worker/src/api-discovery.ts
          grep -q 'api.publicapis.org/entries' services/worker/src/api-discovery.ts
          grep -q 'api.apis.guru/v2/list.json' services/worker/src/api-discovery.ts
          grep -q 'discoveryOnly: true' services/worker/src/api-discovery.ts
          grep -q 'autoExecution: false' services/worker/src/api-discovery.ts
          grep -q 'maybeDiscoverPublicApis' services/worker/src/hermes.ts
          if grep -q 'fetch(candidate.url)' services/worker/src/api-discovery.ts; then
            echo "Discovered API endpoints must not be fetched automatically"
            exit 1
          fi
          if grep -q 'fetch(candidate.openApiUrl)' services/worker/src/api-discovery.ts; then
            echo "Discovered OpenAPI URLs must not be fetched automatically"
            exit 1
          fi

      - name: Enforce dynamic API tool builder boundary
        run: |
          test -f packages/db/migrations/0013_api_tool_builder.sql
          test -f services/worker/src/api-tool-builder.ts
          test -f services/worker/src/api-tool-runtime.ts
          test -f services/worker/test/api-tool-builder.test.mjs
          test -f apps/web/app/api/tools/route.ts
          test -f docs/API_TOOL_BUILDER.md
          grep -q '"api.tool_build"' packages/core/src/action-registry.ts
          grep -q '"api.tool_read"' packages/core/src/action-registry.ts
          grep -q "status in ('draft','validated','approved','disabled')" packages/db/migrations/0013_api_tool_builder.sql
          grep -q 'create table if not exists tool_recipe_runs' packages/db/migrations/0013_api_tool_builder.sql
          grep -q 'Automatic tool building only accepts APIs.guru specifications' services/worker/src/api-tool-builder.ts
          grep -q 'Dynamic API tool is not approved' services/worker/src/api-tool-runtime.ts
          grep -q 'Dynamic API runtime only permits GET/HEAD operations' services/worker/src/api-tool-runtime.ts
          grep -q 'gatewayRead' services/worker/src/api-tool-runtime.ts
          grep -q 'EGRESS_GATEWAY_BASE_URL_TEMPLATE' services/worker/src/api-tool-runtime.ts
          grep -q 'approvedApiTools' services/worker/src/execution/task-runner.ts
          grep -q 'toolInvocation' services/worker/src/product-output.ts
          grep -q 'status=.approved.' apps/web/app/api/tools/route.ts
          grep -q 'fetch("/api/tools"' apps/web/app/settings/page.tsx
          if grep -q 'api.tool_write' packages/core/src/action-registry.ts; then
            echo "Generic dynamic API writes must remain disabled"
            exit 1
          fi
          if grep -q 'fetch(url.toString())' services/worker/src/api-tool-runtime.ts; then
            echo "Dynamic API runtime must not fetch provider URLs directly"
            exit 1
          fi

      - name: Enforce MUSE trust boundary
        run: |
          test -f packages/db/migrations/0014_muse_trust_boundary.sql
          test -f packages/db/migrations/0015_forced_egress_and_authd_acl.sql
          test -f packages/db/migrations/0016_browser_subagent_safety.sql
          test -f services/sentinel/src/index.ts
          test -f services/authd/src/index.ts
          test -f services/privsep-broker/src/index.ts
          test -f services/browser-broker/src/index.ts
          test -f services/browser-subagent/src/index.ts
          test -f services/browser-safety/src/index.ts
          test -f services/browser-cdp-gateway/src/index.ts
          test -f services/egress-gateway/src/index.ts
          test -f services/trust-store/src/index.ts
          test ! -f services/worker/src/sentinel-client.ts
          test -f docs/MUSE_TRUST_BOUNDARY.md
          test -f docs/BROWSER_SUBAGENT_SAFETY.md
          grep -q 'create table if not exists browser_sessions' packages/db/migrations/0014_muse_trust_boundary.sql
          grep -q 'create table if not exists runtime_events' packages/db/migrations/0014_muse_trust_boundary.sql
          grep -q 'credential_handles_scopes_array_check' packages/db/migrations/0015_forced_egress_and_authd_acl.sql
          grep -q 'browser_cdp_gateway:browser.cdp' packages/db/migrations/0016_browser_subagent_safety.sql
          grep -q 'browser_safety' packages/db/migrations/0016_browser_subagent_safety.sql
          grep -q 'alter table conversation_threads force row level security' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'alter table conversation_messages force row level security' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'conversation_messages_thread_created_idx' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'safety_state' packages/db/migrations/0016_browser_subagent_safety.sql
          grep -q 'buildCapabilityScope' services/sentinel/src/index.ts
          grep -q 'concreteRequestMatches' services/sentinel/src/index.ts
          grep -q 'capability_hash_mismatch' services/sentinel/src/index.ts
          grep -q 'matchAutonomyRule' services/sentinel/src/index.ts
          grep -q 'x-agesoma-trust-caller' services/trust-store/src/index.ts
          grep -q 'caller_provider_scope_denied' services/authd/src/index.ts
          grep -q 'browser_broker:browser.provider' packages/db/migrations/0015_forced_egress_and_authd_acl.sql
          grep -q 'browser_cdp_gateway' services/authd/src/index.ts
          grep -q 'browser.cdp' services/authd/src/index.ts
          grep -q 'privsep_broker:whatsapp.send' packages/db/migrations/0015_forced_egress_and_authd_acl.sql
          grep -q 'callerMayUse' services/egress-gateway/src/index.ts
          grep -q 'lookup:(_hostname,_options,callback)' services/egress-gateway/src/index.ts
          grep -q 'secretQuery' services/egress-gateway/src/index.ts
          grep -q 'EGRESS_GATEWAY_URL' services/browser-broker/src/index.ts
          grep -q 'EGRESS_GATEWAY_URL' services/privsep-broker/src/index.ts
          grep -q 'external_untrusted' services/browser-broker/src/index.ts
          grep -q 'EGRESS_GATEWAY_BASE_URL_TEMPLATE' services/worker/src/api-tool-runtime.ts
          grep -q 'browserAccess' services/worker/src/hermes.ts
          grep -q 'external_untrusted' services/worker/src/hermes.ts
          if grep -R -n 'from "@agesoma/db"' services/sentinel services/authd services/browser-broker services/browser-subagent services/browser-safety services/browser-cdp-gateway services/privsep-broker services/egress-gateway services/model-gateway; then
            echo "Work Cell trust-boundary services must not have database credentials"
            exit 1
          fi
          if grep -q 'DATABASE_URL' deploy/production/workcell-compose.yml; then
            echo "Work Cell compose must not inject database credentials"
            exit 1
          fi
          if grep -R -n -E 'sessionViewerUrl|debugUrl|websocketUrl|connectUrl' services/browser-broker; then
            echo "Browser provider viewer/CDP URLs must not escape the Browser Broker"
            exit 1
          fi
          if grep -q 'STEEL_API_KEY' services/browser-broker/src/index.ts; then
            echo "Browser Broker must resolve Steel through Authd"
            exit 1
          fi
          if grep -R -n -E 'lookup|httpsRequest' services/browser-broker/src services/privsep-broker/src services/authd/src services/sentinel/src; then
            echo "Only the Egress Gateway may resolve or open privileged internet connections"
            exit 1
          fi

      - name: Enforce browser subagent safety boundary
        run: |
          test -f services/browser-subagent/src/index.ts
          test -f services/browser-safety/src/index.ts
          test -f services/browser-safety/src/policy.ts
          test -f services/browser-safety/test/policy.test.mjs
          test -f services/browser-cdp-gateway/src/index.ts
          test -f docs/BROWSER_SUBAGENT_SAFETY.md
          grep -q '"agent-browser": "0.38.1"' services/browser-subagent/package.json
          grep -q 'AGENT_BROWSER_NO_WEBMCP:"1"' services/browser-subagent/src/index.ts
          grep -q 'snapshot","-c","-d","8"' services/browser-subagent/src/index.ts
          grep -q 'rawDomExposed:false' services/browser-subagent/src/index.ts
          grep -q 'cdpExposed:false' services/browser-subagent/src/index.ts
          grep -q 'connect.steel.dev' services/browser-cdp-gateway/src/index.ts
          grep -q '/v1/browser/cdp-context' services/browser-cdp-gateway/src/index.ts
          grep -q 'browser_cdp_gateway' services/browser-cdp-gateway/src/index.ts
          grep -q 'prompt_injection_signature' services/browser-safety/src/policy.ts
          grep -q 'sensitive_credential_field' services/browser-safety/src/policy.ts
          grep -q 'high_consequence_click' services/browser-safety/src/policy.ts
          grep -q 'browser_subagent_rejected' services/browser-broker/src/index.ts
          grep -q 'browser_safety_rejected' services/browser-broker/src/index.ts
          grep -q '/v1/snapshot' services/browser-broker/src/index.ts
          grep -q '/v1/navigate' services/browser-broker/src/index.ts
          grep -q '/v1/action' services/browser-broker/src/index.ts
          grep -q 'If Browser Broker reports safety decision REVIEW or BLOCK' services/worker/src/hermes.ts
          if grep -Eq '"(eval|upload)"' services/browser-subagent/src/index.ts; then
            echo "Browser Subagent must not expose eval or upload verbs"
            exit 1
          fi
          if grep -q 'fetch(' services/browser-safety/src/index.ts; then
            echo "Browser Safety v1 must remain independent and network-free"
            exit 1
          fi

      - name: Enforce model gateway boundary
        run: |
          test -f services/model-gateway/src/index.ts
          test -f services/model-gateway/src/policy.ts
          test -f services/model-gateway/test/policy.test.mjs
          test -f services/model-gateway/Dockerfile
          test -f deploy/production/hermes-entrypoint.sh
          grep -q 'api.openai.com' services/model-gateway/src/policy.ts
          grep -q 'api.anthropic.com' services/model-gateway/src/policy.ts
          grep -q 'inference-api.nousresearch.com' services/model-gateway/src/policy.ts
          grep -q 'provider_path_denied' services/model-gateway/src/policy.ts
          grep -q 'MODEL_GATEWAY_TOKEN' services/model-gateway/src/index.ts
          grep -q 'MODEL_OPENAI_API_KEY' services/model-gateway/src/index.ts
          grep -q 'MODEL_ANTHROPIC_API_KEY' services/model-gateway/src/index.ts
          grep -q 'MODEL_NOUS_API_KEY' services/model-gateway/src/index.ts
          grep -q 'cat > "$HERMES_HOME/.env"' deploy/production/hermes-entrypoint.sh
          grep -q 'rm -f "$HERMES_HOME/.op.env"' deploy/production/hermes-entrypoint.sh
          if grep -Eq '/v1/(files|fine_tuning|batches|uploads)' services/model-gateway/src/policy.ts; then
            echo "Model Gateway must expose inference surfaces only"
            exit 1
          fi
          if grep -R -n 'DATABASE_URL' services/model-gateway deploy/production/workcell-compose.yml | grep model-gateway; then
            echo "Model Gateway must not receive database credentials"
            exit 1
          fi

      - name: Enforce MUSE product experience
        run: |
          test -f packages/db/migrations/0017_muse_product_experience.sql
          test -f apps/web/lib/conversation.ts
          test -f apps/web/lib/approval-card.ts
          test -f apps/web/app/api/threads/route.ts
          test -f apps/web/app/api/ideas/route.ts
          test -f apps/web/app/api/artifacts/route.ts
          test -f docs/MUSE_PRODUCT_EXPERIENCE.md
          grep -q 'create table if not exists conversation_threads' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'create table if not exists conversation_messages' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'conversation_threads_one_main_idx' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'alter table conversation_threads force row level security' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'alter table conversation_messages force row level security' packages/db/migrations/0017_muse_product_experience.sql
          grep -q 'appendConversationMessage' apps/web/app/api/agesoma/route.ts
          grep -q 'threadId: threadId ?? null' apps/web/app/api/agesoma/route.ts
          grep -q 'conversation_messages' services/worker/src/product-output.ts
          grep -q 'artifactId: persistedArtifact.id' services/worker/src/product-output.ts
          grep -q 'className="museShell"' apps/web/app/agesoma-client.tsx
          grep -q 'className="museNav"' apps/web/app/agesoma-client.tsx
          grep -q 'className="museThreadRail"' apps/web/app/agesoma-client.tsx
          grep -q 'className="museDecisionCard"' apps/web/app/agesoma-client.tsx
          grep -q 'view==="goals"' apps/web/app/agesoma-client.tsx
          grep -q 'view==="ideas"' apps/web/app/agesoma-client.tsx
          grep -q 'view==="artifacts"' apps/web/app/agesoma-client.tsx
          grep -q 'loadActivityPanel' apps/web/app/agesoma-client.tsx
          grep -q 'Memória & permissões' apps/web/app/agesoma-client.tsx
          grep -q 'Conversar sobre isto' apps/web/app/agesoma-client.tsx
          grep -q 'z.literal("deny")' apps/web/app/api/agesoma/route.ts
          grep -q 'decideApproval("deny",approval)' apps/web/app/agesoma-client.tsx
          grep -q 'approvalCard' apps/web/app/page.tsx
          if grep -n -E 'HERMES|Sentinel|Work Cell|digital_agents|runtime_events' apps/web/app/agesoma-client.tsx; then
            echo "Internal architecture language must stay out of the Muse product shell"
            exit 1
          fi

      - name: Enforce RiverThree product package
        run: |
          grep -q 'id: "agesoma"' apps/web/lib/riverthree-product.ts
          grep -q 'name: "AGESOMA"' apps/web/lib/riverthree-product.ts
          grep -q 'category: "personal-executive-assistant"' apps/web/lib/riverthree-product.ts
          grep -q 'wordmark: "/agesoma-wordmark.jpeg"' apps/web/lib/riverthree-product.ts
          test -f apps/web/public/agesoma-wordmark.jpeg
          grep -q 'onboardingMode: "consumerFast"' apps/web/lib/riverthree-product.ts
          grep -q 'intelligenceOrb: "contextual"' apps/web/lib/riverthree-product.ts
          grep -q 'genZ: "subtle"' apps/web/lib/riverthree-product.ts
          grep -q 'mode: "agesomaConversation"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "personal_context"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "priority_area"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "first_request"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "assistant_preview"' apps/web/lib/riverthree-product.ts
          grep -q 'id: "first_execution"' apps/web/lib/riverthree-product.ts
          grep -q 'activationEvent: "first_agesoma_request_accepted"' apps/web/lib/riverthree-product.ts
          grep -q 'r3ProgressHeader' apps/web/app/onboarding/page.tsx
          grep -q 'AgesomaClient' apps/web/app/page.tsx
          if grep -n -E 'CAL AI|RIVERTHREE|Business Consumerized|actionAgent|Work Cell|Watchers' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "Internal design or architecture language must never appear in public product UI"
            exit 1
          fi
          if grep -n -E '\bROI\b|InstantWork' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "Public AGESOMA UI must use AGESOMA identity and demonstrate value without legacy labels"
            exit 1
          fi

      - name: Enforce canonical RiverThree UI bindings
        run: |
          grep -q 'className="museShell"' apps/web/app/agesoma-client.tsx
          grep -q 'className="museTopbar"' apps/web/app/agesoma-client.tsx
          grep -q 'className="museConversation"' apps/web/app/agesoma-client.tsx
          grep -q 'className="museComposer"' apps/web/app/agesoma-client.tsx
          grep -q 'museAvatar' apps/web/app/agesoma-client.tsx
          grep -q 'museDecisionCard' apps/web/app/agesoma-client.tsx
          grep -q 'museIdeaGrid' apps/web/app/agesoma-client.tsx
          grep -q 'museArtifactView' apps/web/app/agesoma-client.tsx
          grep -q 'className="onboardingCard"' apps/web/app/onboarding/page.tsx
          grep -q 'className="r3WelcomeMaterial"' apps/web/app/onboarding/page.tsx
          grep -q 'className="choiceCheck"' apps/web/app/onboarding/page.tsx
          grep -q 'className="r3ResultPreview"' apps/web/app/onboarding/page.tsx
          grep -q 'className="r3FirstAction"' apps/web/app/onboarding/page.tsx
          if grep -E -n 'className="(homeHero|quietState|liveIntelligence|nextBestAction|metricStrip|activitySection|activityList|activityRow|resultsSection|resultCard|onboardingStage|welcomeMaterial|choiceMark|firstActionCard|intelligenceOrb)"' apps/web/app/page.tsx apps/web/app/agesoma-client.tsx apps/web/app/onboarding/page.tsx; then
            echo "Non-canonical UI bindings detected; RiverThree classes must be used directly"
            exit 1
          fi

      - name: Enforce independent outcome verification
        run: |
          if grep -q "insert into outcome_events" services/worker/src/product-output.ts; then
            echo "Executor output must not write verified outcomes directly"
            exit 1
          fi
          grep -q "requireOutcomeVerifier" apps/web/app/api/outcomes/route.ts

      - name: Enforce resolve-before-approval
        run: |
          grep -q 'executionAction = plan.requiresApproval ? "business.work" : plan.action' apps/web/app/api/requests/route.ts
          grep -q 'plan.requiresApproval ? "business.work" : plan.action' apps/web/app/api/coordinate/route.ts
          grep -q 'Consequential action is not fully resolved' apps/web/app/api/approvals/route.ts
          grep -q 'Consequential capability is unresolved' services/worker/src/execution/task-runner.ts
          grep -q 'scope_hash' packages/db/src/repositories/approvals.ts
          grep -q 'buildCapabilityScope' apps/web/app/api/agesoma/route.ts
          grep -q 'scopeHash' apps/web/app/api/agesoma/route.ts

      - name: Enforce customer channel restriction
        run: |
          grep -q 'platform_toolsets' deploy/production/hermes-config.yaml
          grep -q 'whatsapp:' deploy/production/hermes-config.yaml
          if grep -A3 'whatsapp:' deploy/production/hermes-config.yaml | grep -Eq 'terminal|code_execution'; then
            echo "Customer WhatsApp must not expose terminal/code execution"
            exit 1
          fi

      - name: Enforce execution boundaries
        run: |
          test -f deploy/production/workcell-compose.yml
          test -f deploy/production/provision-workcell.sh
          test -f deploy/production/hermes-entrypoint.sh
          test ! -f deploy/production/sentinel-egress.conf
          test ! -f deploy/production/approved-domains.txt
          test ! -f deploy/production/credential-broker.conf.template
          grep -q 'HERMES_BASE_URL_TEMPLATE' services/worker/src/hermes.ts
          grep -q 'Tenant-routed Hermes Work Cell is required; shared Hermes is disabled' services/worker/src/hermes.ts
          grep -q 'CREDENTIAL_BROKER_BASE_URL_TEMPLATE' services/worker/src/hermes.ts
          grep -q 'EGRESS_GATEWAY_BASE_URL_TEMPLATE' deploy/production/docker-compose.yml
          grep -q 'TRUST_STORE_MASTER_SECRET' deploy/production/docker-compose.yml
          grep -q 'AGESOMA_ALLOW_SHARED_HERMES: "false"' deploy/production/docker-compose.yml
          if grep -q '^  hermes:' deploy/production/docker-compose.yml; then
            echo "Canonical control plane must not embed a shared Hermes executor"
            exit 1
          fi

          hermes_block="$(awk '/^  hermes:/{flag=1} /^networks:/{if(flag)flag=0} flag' deploy/production/workcell-compose.yml)"
          sentinel_block="$(awk '/^  sentinel:/{flag=1} /^  authd:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          authd_block="$(awk '/^  authd:/{flag=1} /^  egress-gateway:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          egress_block="$(awk '/^  egress-gateway:/{flag=1} /^  credential-broker:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          broker_block="$(awk '/^  credential-broker:/{flag=1} /^  browser-broker:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          browser_block="$(awk '/^  browser-broker:/{flag=1} /^  browser-safety:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          safety_block="$(awk '/^  browser-safety:/{flag=1} /^  browser-cdp-gateway:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          cdp_block="$(awk '/^  browser-cdp-gateway:/{flag=1} /^  browser-subagent:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          subagent_block="$(awk '/^  browser-subagent:/{flag=1} /^  model-gateway:/{flag=0} flag' deploy/production/workcell-compose.yml)"
          model_block="$(awk '/^  model-gateway:/{flag=1} /^  hermes:/{flag=0} flag' deploy/production/workcell-compose.yml)"

          if printf '%s\n' "$hermes_block" | grep -Eq 'WHATSAPP_CLOUD_ACCESS_TOKEN|WINDSOR_API_KEY|STEEL_API_KEY|CREDENTIAL_BROKER_SERVICE_TOKEN|AUTHD_|SENTINEL_SERVICE_TOKEN|TRUST_STORE_|BROWSER_(CDP|SUBAGENT|SAFETY)_TOKEN'; then
            echo "Trust-boundary secrets must never be injected into Hermes"
            exit 1
          fi
          if printf '%s\n' "$hermes_block" | grep -Eq 'browser_control_cell|browser_cdp_outbound|HTTP_PROXY|HTTPS_PROXY|ALL_PROXY|runtime_outbound|model_outbound|privileged_outbound'; then
            echo "HERMES must not reach browser-control or outbound networks"
            exit 1
          fi

          printf '%s\n' "$egress_block" | grep -q 'privileged_outbound'
          printf '%s\n' "$cdp_block" | grep -q 'browser_cdp_outbound'
          printf '%s\n' "$model_block" | grep -q 'model_outbound'

          for block in "$sentinel_block" "$authd_block" "$broker_block" "$browser_block" "$safety_block" "$subagent_block"; do
            if printf '%s\n' "$block" | grep -Eq 'privileged_outbound|browser_cdp_outbound|model_outbound|runtime_outbound'; then
              echo "Only dedicated gateway services may have outbound networking"
              exit 1
            fi
          done

          printf '%s\n' "$browser_block" | grep -q 'browser_control_cell'
          printf '%s\n' "$safety_block" | grep -q 'browser_control_cell'
          printf '%s\n' "$subagent_block" | grep -q 'browser_control_cell'
          printf '%s\n' "$cdp_block" | grep -q 'browser_control_cell'
          printf '%s\n' "$cdp_block" | grep -q 'credential_cell'
          if printf '%s\n' "$safety_block$subagent_block" | grep -Eq 'credential_cell|tenant_cell'; then
            echo "Browser Safety and Subagent must remain isolated on browser_control_cell"
            exit 1
          fi

          if printf '%s\n' "$broker_block" | grep -Eq 'WHATSAPP_CLOUD_ACCESS_TOKEN|WINDSOR_API_KEY|STEEL_API_KEY'; then
            echo "Privsep Broker must use caller-scoped Authd credentials"
            exit 1
          fi
          printf '%s\n' "$broker_block" | grep -q 'AUTHD_PRIVSEP_TOKEN'
          printf '%s\n' "$broker_block" | grep -q 'EGRESS_PRIVSEP_TOKEN'

          if printf '%s\n' "$browser_block" | grep -q 'STEEL_API_KEY'; then
            echo "Browser Broker must resolve Steel through Authd"
            exit 1
          fi
          printf '%s\n' "$browser_block" | grep -q 'AUTHD_BROWSER_TOKEN'
          printf '%s\n' "$browser_block" | grep -q 'EGRESS_BROWSER_TOKEN'
          printf '%s\n' "$browser_block" | grep -q 'BROWSER_SUBAGENT_TOKEN'
          printf '%s\n' "$browser_block" | grep -q 'BROWSER_SAFETY_TOKEN'

          printf '%s\n' "$authd_block" | grep -q 'AUTHD_BROWSER_CDP_TOKEN'
          printf '%s\n' "$cdp_block" | grep -q 'AUTHD_BROWSER_CDP_TOKEN'
          printf '%s\n' "$cdp_block" | grep -q 'TRUST_STORE_BROWSER_CDP_TOKEN'
          printf '%s\n' "$cdp_block" | grep -q 'BROWSER_CDP_TOKEN'
          if printf '%s\n' "$cdp_block" | grep -q 'STEEL_API_KEY'; then
            echo "CDP Gateway must resolve Steel through Authd, never environment injection"
            exit 1
          fi

          printf '%s\n' "$authd_block" | grep -q 'WHATSAPP_CLOUD_ACCESS_TOKEN'
          printf '%s\n' "$authd_block" | grep -q 'WINDSOR_API_KEY'
          printf '%s\n' "$authd_block" | grep -q 'STEEL_API_KEY'
          if printf '%s\n' "$sentinel_block$egress_block$model_block$safety_block$subagent_block" | grep -q 'STEEL_API_KEY'; then
            echo "Steel credential may exist only in Authd"
            exit 1
          fi

          printf '%s\n' "$model_block" | grep -q 'MODEL_OPENAI_API_KEY'
          printf '%s\n' "$model_block" | grep -q 'MODEL_ANTHROPIC_API_KEY'
          printf '%s\n' "$model_block" | grep -q 'MODEL_NOUS_API_KEY'
          if printf '%s\n' "$model_block" | grep -Eq 'WHATSAPP_CLOUD_ACCESS_TOKEN|WINDSOR_API_KEY|STEEL_API_KEY|DATABASE_URL'; then
            echo "Model Gateway must contain model credentials only"
            exit 1
          fi

          printf '%s\n' "$hermes_block" | grep -q 'OPENAI_API_KEY: ${MODEL_GATEWAY_TOKEN}'
          printf '%s\n' "$hermes_block" | grep -q 'ANTHROPIC_API_KEY: ${MODEL_GATEWAY_TOKEN}'
          printf '%s\n' "$hermes_block" | grep -q 'NOUS_API_KEY: ${MODEL_GATEWAY_TOKEN}'
          printf '%s\n' "$hermes_block" | grep -q 'OPENAI_BASE_URL: http://model-gateway-'
          printf '%s\n' "$hermes_block" | grep -q 'ANTHROPIC_BASE_URL: http://model-gateway-'
          printf '%s\n' "$hermes_block" | grep -q 'NOUS_INFERENCE_BASE_URL: http://model-gateway-'
          printf '%s\n' "$hermes_block" | grep -q 'hermes-entrypoint.sh:/usr/local/bin/agesoma-hermes-entrypoint:ro'
          printf '%s\n' "$hermes_block" | grep -q 'command: \["/bin/sh", "/usr/local/bin/agesoma-hermes-entrypoint"\]'
          if printf '%s\n' "$hermes_block" | grep -Eq 'OPENAI_API_KEY: ${OPENAI_API_KEY|ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY|NOUS_API_KEY: ${NOUS_API_KEY'; then
            echo "Real model-provider secrets must never be injected into HERMES"
            exit 1
          fi

          grep -q 'docker network create --internal "agesoma-cell-$TENANT_ID"' deploy/production/provision-workcell.sh
          grep -q 'docker network create --internal "agesoma-credentials-$TENANT_ID"' deploy/production/provision-workcell.sh
          grep -q 'docker network create --internal "agesoma-browser-control-$TENANT_ID"' deploy/production/provision-workcell.sh
          grep -q 'derive_token sentinel' deploy/production/provision-workcell.sh
          grep -q 'derive_token authd-browser' deploy/production/provision-workcell.sh
          grep -q 'derive_token egress-browser' deploy/production/provision-workcell.sh
          grep -q 'derive_token browser_cdp_gateway' deploy/production/provision-workcell.sh
          grep -q 'derive_token authd-browser-cdp' deploy/production/provision-workcell.sh
          grep -q 'derive_token browser-cdp' deploy/production/provision-workcell.sh
          grep -q 'derive_token browser-subagent' deploy/production/provision-workcell.sh
          grep -q 'derive_token browser-safety' deploy/production/provision-workcell.sh
          grep -q 'derive_token model-gateway' deploy/production/provision-workcell.sh
          grep -q 'cred://steel/default' deploy/production/provision-workcell.sh
          grep -q 'cred://whatsapp/default' deploy/production/provision-workcell.sh
          grep -q 'cred://windsor/default' deploy/production/provision-workcell.sh

      - name: Validate production topology
        run: |
          sh -n deploy/production/provision-workcell.sh
          sh -n deploy/production/hermes-entrypoint.sh
          DATABASE_URL=postgresql://user:pass@db.example.invalid/agesoma \
          TRUST_STORE_MASTER_SECRET=test-trust-master \
          EGRESS_CONTROL_TOKEN=test-control-egress \
          docker compose -f deploy/production/docker-compose.yml config >/dev/null
          AGESOMA_TENANT_ID=00000000-0000-0000-0000-000000000001 \
          HERMES_SERVICE_TOKEN=test-hermes-token \
          MODEL_GATEWAY_TOKEN=test-model-gateway-token \
          CREDENTIAL_BROKER_SERVICE_TOKEN=test-broker-token \
          SENTINEL_SERVICE_TOKEN=test-sentinel-token \
          TRUST_STORE_SENTINEL_TOKEN=test-trust-sentinel \
          TRUST_STORE_AUTHD_TOKEN=test-trust-authd \
          TRUST_STORE_BROWSER_TOKEN=test-trust-browser \
          TRUST_STORE_BROWSER_CDP_TOKEN=test-trust-browser-cdp \
          AUTHD_BROWSER_TOKEN=test-authd-browser \
          AUTHD_BROWSER_CDP_TOKEN=test-authd-browser-cdp \
          AUTHD_PRIVSEP_TOKEN=test-authd-privsep \
          EGRESS_BROWSER_TOKEN=test-egress-browser \
          EGRESS_PRIVSEP_TOKEN=test-egress-privsep \
          EGRESS_CONTROL_TOKEN=test-control-egress \
          BROWSER_CDP_TOKEN=test-browser-cdp \
          BROWSER_SUBAGENT_TOKEN=test-browser-subagent \
          BROWSER_SAFETY_TOKEN=test-browser-safety \
          STEEL_API_KEY=test-steel-key \
          WINDSOR_API_KEY=test-windsor-key \
          WHATSAPP_GRAPH_VERSION=v23.0 \
          WHATSAPP_CLOUD_PHONE_NUMBER_ID=100000000000001 \
          WHATSAPP_CLOUD_ACCESS_TOKEN=test-whatsapp-token \
          docker compose -f deploy/production/workcell-compose.yml config >/dev/null

      - name: Enforce tenant isolation migrations
        run: |
          grep -q 'force row level security' packages/db/migrations/0006_tenant_isolation.sql
          grep -q 'grant usage on schema agesoma_p0 to authenticated' packages/db/migrations/0006_tenant_isolation.sql
          grep -q 'credential_handles' packages/db/migrations/0005_muse_hardening.sql
          grep -q 'egress_decisions' packages/db/migrations/0005_muse_hardening.sql
          grep -q 'runtime_namespace' packages/db/migrations/0005_muse_hardening.sql
          grep -q 'alter table team_members force row level security' packages/db/migrations/0007_team_coordination.sql
          grep -q 'alter table work_assignments force row level security' packages/db/migrations/0007_team_coordination.sql
          grep -q 'alter table digital_agents force row level security' packages/db/migrations/0010_agent_registry.sql
          grep -q 'alter table agent_task_assignments force row level security' packages/db/migrations/0010_agent_registry.sql
          grep -q 'foreign key (tenant_id, agent_id)' packages/db/migrations/0010_agent_registry.sql
          grep -q 'foreign key (tenant_id, task_id)' packages/db/migrations/0010_agent_registry.sql
          grep -q 'alter table personal_context_entries force row level security' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'alter table connected_services force row level security' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'alter table proactivity_preferences force row level security' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'alter table proactive_interruptions force row level security' packages/db/migrations/0011_personal_assistant_foundation.sql
          grep -q 'alter table activity_events force row level security' packages/db/migrations/0012_muse_parity_runtime_attention.sql
          grep -q 'alter table attention_decisions force row level security' packages/db/migrations/0012_muse_parity_runtime_attention.sql
          grep -q 'alter table tool_recipes force row level security' packages/db/migrations/0013_api_tool_builder.sql
          grep -q 'alter table tool_recipe_runs force row level security' packages/db/migrations/0013_api_tool_builder.sql
          grep -q 'alter table browser_sessions force row level security' packages/db/migrations/0014_muse_trust_boundary.sql
          grep -q 'alter table runtime_events force row level security' packages/db/migrations/0014_muse_trust_boundary.sql
          grep -q 'credential_handles_surrogate_idx' packages/db/migrations/0014_muse_trust_boundary.sql
          grep -q 'tasks_data_taint_check' packages/db/migrations/0014_muse_trust_boundary.sql
          grep -q 'credential_handles_scopes_array_check' packages/db/migrations/0015_forced_egress_and_authd_acl.sql
          grep -q 'sentinel-v3' packages/db/migrations/0015_forced_egress_and_authd_acl.sql
          grep -q 'browser_cdp_gateway:browser.cdp' packages/db/migrations/0016_browser_subagent_safety.sql
          grep -q 'browser_sessions_tenant_task_live_idx' packages/db/migrations/0016_browser_subagent_safety.sql
          grep -q 'browser_subagent' packages/db/migrations/0016_browser_subagent_safety.sql
          grep -q 'browser_safety' packages/db/migrations/0016_browser_subagent_safety.sql

      - name: Build web app
        run: npm run build --workspace @agesoma/web

      - name: Mirror Next.js output to Vercel project root
        run: |
          rm -rf .next
          cp -R apps/web/.next .next
          test -f .next/routes-manifest.json
          test -f .next/build-manifest.json
