name: AGESOMA SME skills QA

on:
  push:
    branches:
      - feat/agesoma-workforce-computers-20261016
    paths:
      - "packages/core/src/smb-skills.ts"
      - "packages/core/src/index.ts"
      - "packages/core/src/product-families.ts"
      - "packages/core/src/platform-adapter-policy.ts"
      - "apps/web/app/instant/**"
      - "apps/web/app/dots/**"
      - "apps/web/app/families/**"
      - "apps/web/app/page.tsx"
      - "tests/product-families.test.mjs"
      - "INSTDESIGN.MD"
      - "PLATFORMDESIGN.md"
      - "tests/instdesign-contract.test.mjs"
      - "AGENTS.md"
      - "docs/PLATFORM_INSTANT_DOTS.md"
      - "apps/web/app/workforce/ceo/**"
      - "apps/web/app/workforce/workforce-preview.module.css"
      - "apps/web/app/start/**"
      - "apps/web/app/age-tokens.css"
      - "apps/web/app/linear-midnight.css"
      - "apps/web/app/age-product-bridge.css"
      - "apps/web/app/layout.tsx"
      - "apps/web/package.json"
      - "AGEDESIGN.md"
      - "tests/midnight-style.test.mjs"
      - "tests/agedesign-acceptance.test.mjs"
      - "tests/workforce-ui.test.mjs"
      - "apps/web/app/api/agesoma/route.ts"
      - "tests/smb-skills.test.mjs"
      - ".github/workflows/smb-skills-qa.yml"
  pull_request:
    paths:
      - "packages/core/src/smb-skills.ts"
      - "packages/core/src/index.ts"
      - "packages/core/src/product-families.ts"
      - "packages/core/src/platform-adapter-policy.ts"
      - "apps/web/app/instant/**"
      - "apps/web/app/dots/**"
      - "apps/web/app/families/**"
      - "apps/web/app/page.tsx"
      - "tests/product-families.test.mjs"
      - "INSTDESIGN.MD"
      - "PLATFORMDESIGN.md"
      - "tests/instdesign-contract.test.mjs"
      - "AGENTS.md"
      - "docs/PLATFORM_INSTANT_DOTS.md"
      - "apps/web/app/workforce/ceo/**"
      - "apps/web/app/workforce/workforce-preview.module.css"
      - "apps/web/app/start/**"
      - "apps/web/app/age-tokens.css"
      - "apps/web/app/linear-midnight.css"
      - "apps/web/app/age-product-bridge.css"
      - "apps/web/app/layout.tsx"
      - "apps/web/package.json"
      - "AGEDESIGN.md"
      - "tests/midnight-style.test.mjs"
      - "tests/agedesign-acceptance.test.mjs"
      - "tests/workforce-ui.test.mjs"
      - "apps/web/app/api/agesoma/route.ts"
      - "tests/smb-skills.test.mjs"
      - ".github/workflows/smb-skills-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Native SME workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Execute local-first, zero-token tests
        run: node --test tests/smb-skills.test.mjs tests/midnight-style.test.mjs tests/agedesign-acceptance.test.mjs tests/workforce-ui.test.mjs tests/product-families.test.mjs tests/instdesign-contract.test.mjs
      - name: Verify CEO-first integration tests
        run: node --test tests/ceo-first-setup.test.mjs tests/ceo-companion.test.mjs

  build:
    name: Typecheck and Next production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workspace dependencies (no lockfile in repository)
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Check core and web TypeScript
        run: npm run typecheck --workspace @agesoma/core && npm run typecheck --workspace @agesoma/web
      - name: Check Next build with ephemeral non-production auth secret
        shell: bash
        run: |
          set -euo pipefail
          # Used only while collecting build-time metadata. Never used for real sessions.
          export BETTER_AUTH_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(40).toString("hex"))')"
          npm run build --workspace @agesoma/web
