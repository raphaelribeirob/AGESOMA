services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agesoma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agesoma_postgres:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - agesoma_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  brain:
    build:
      context: ./services/brain
    environment:
      AGESOMA_BRAIN_INTERNAL_API_TOKEN: ${AGESOMA_BRAIN_INTERNAL_API_TOKEN:?AGESOMA_BRAIN_INTERNAL_API_TOKEN is required}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required for Graphiti}
      SEMAPHORE_LIMIT: ${AGESOMA_BRAIN_SEMAPHORE_LIMIT:-4}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agesoma_postgres:
  agesoma_neo4j:
