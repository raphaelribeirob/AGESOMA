services:
  worker:
    container_name: agesoma-control-worker
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AGESOMA_DB_SCHEMA: agesoma_p0
      AGESOMA_BRAIN_URL: ${AGESOMA_BRAIN_URL:-http://brain:8080}
      AGESOMA_BRAIN_INTERNAL_API_TOKEN: ${AGESOMA_BRAIN_INTERNAL_API_TOKEN}
      AGESOMA_BRAIN_SEARCH_TIMEOUT_MS: ${AGESOMA_BRAIN_SEARCH_TIMEOUT_MS:-8000}
      AGESOMA_BRAIN_INGEST_TIMEOUT_MS: ${AGESOMA_BRAIN_INGEST_TIMEOUT_MS:-45000}
      HERMES_BASE_URL_TEMPLATE: ${HERMES_BASE_URL_TEMPLATE:-http://hermes-{tenantId}:8642}
      AGESOMA_ALLOW_SHARED_HERMES: "false"
      HERMES_SERVICE_TOKEN: ${HERMES_SERVICE_TOKEN}
      HERMES_RUN_TIMEOUT_MS: ${HERMES_RUN_TIMEOUT_MS:-120000}
      HERMES_RUN_POLL_MS: ${HERMES_RUN_POLL_MS:-1000}
      CREDENTIAL_BROKER_BASE_URL_TEMPLATE: ${CREDENTIAL_BROKER_BASE_URL_TEMPLATE:-http://broker-{tenantId}:8080}
      CREDENTIAL_BROKER_SERVICE_TOKEN: ${CREDENTIAL_BROKER_SERVICE_TOKEN}
      AGESOMA_MIN_NET_VALUE_CENTS: ${AGESOMA_MIN_NET_VALUE_CENTS:-100}
      AGESOMA_MAX_TASK_COST_CENTS: ${AGESOMA_MAX_TASK_COST_CENTS:-500}
    networks:
      - control_outbound

  brain:
    container_name: agesoma-company-brain
    build:
      context: ../../services/brain
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AGESOMA_BRAIN_INTERNAL_API_TOKEN: ${AGESOMA_BRAIN_INTERNAL_API_TOKEN}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SEMAPHORE_LIMIT: ${AGESOMA_BRAIN_SEMAPHORE_LIMIT:-4}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - control_outbound
      - brain_private

  neo4j:
    container_name: agesoma-company-graph
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - agesoma_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER} -p $${NEO4J_PASSWORD} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - brain_private

networks:
  control_outbound:
    driver: bridge
  brain_private:
    driver: bridge
    internal: true

volumes:
  agesoma_neo4j:
